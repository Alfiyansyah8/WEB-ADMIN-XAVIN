<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GodDataX - Admin Dashboard</title>
    <link rel="icon" type="image/png" href="SaiKuto.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #e5e5e5;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        /* Layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 24px; margin-bottom: 32px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-logo {
            width: 48px; height: 48px; border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255,26,26,0.4);
        }
        .header-title { font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(255,26,26,0.5); }
        .header-subtitle { font-size: 14px; color: #888; font-weight: 300; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 10px; border: none;
            font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-glass {
            background: rgba(18,18,18,0.6); color: #e5e5e5;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
        }
        .btn-glass:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .btn-red {
            background: linear-gradient(135deg, #ff1a1a, #e60000);
            color: #fff; border: none;
            box-shadow: 0 4px 15px rgba(255,26,26,0.25);
        }
        .btn-red:hover { background: linear-gradient(135deg, #ff4d4d, #ff1a1a); }
        .btn-red:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger-sm {
            padding: 8px; border-radius: 8px; border: none;
            background: rgba(255,26,26,0.1); color: #ff4d4d; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-danger-sm:hover { background: #ff1a1a; color: #fff; transform: scale(1.05); }

        /* Glass Panel */
        .glass {
            background: rgba(18,18,18,0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            border-radius: 16px;
        }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 32px; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }
        .stat-card { padding: 24px; position: relative; overflow: hidden; }
        .stat-card .glow {
            position: absolute; right: -24px; top: -24px;
            width: 96px; height: 96px; border-radius: 50%; filter: blur(40px);
            transition: all 0.3s;
        }
        .stat-card:hover .glow { opacity: 0.8; transform: scale(1.2); }
        .stat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .stat-label { font-size: 14px; color: #888; margin-bottom: 4px; }
        .stat-value { font-size: 36px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 12px; }
        .stat-icon { padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: #fff; }
        .stat-desc { font-size: 12px; color: #555; }

        /* Auth Styles */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            background: rgba(18,18,18,0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,26,26,0.15);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 40px rgba(255,26,26,0.1);
        }
        .auth-box img { width: 80px; margin-bottom: 24px; }
        .auth-box h2 { color: #fff; margin-bottom: 8px; font-weight: 700; font-size: 24px; }
        .auth-box p { color: #888; margin-bottom: 32px; font-size: 14px; }
        .auth-input {
            width: 100%; padding: 14px 16px; margin-bottom: 16px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; font-family: inherit; font-size: 15px;
            outline: none; transition: border-color 0.2s;
        }
        .auth-input:focus { border-color: #ff1a1a; }
        .auth-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #ff1a1a 0%, #b30000 100%);
            color: #fff; font-weight: 600; font-size: 16px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(255,26,26,0.3);
        }
        .auth-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,26,26,0.4); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Pulse dot */
        .pulse-dot { position: relative; display: inline-flex; width: 12px; height: 12px; }
        .pulse-dot .ping {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; background: #3b82f6; opacity: 0.75;
            animation: ping 1.5s cubic-bezier(0,0,0.2,1) infinite;
        }
        .pulse-dot .dot { position: relative; width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }

        /* Main Layout */
        .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 500; color: #888; margin-bottom: 8px; }
        .form-input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-family: 'Outfit', sans-serif; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .form-input:focus { border-color: #ff1a1a; box-shadow: 0 0 0 2px rgba(255,26,26,0.15); }
        .form-input::placeholder { color: #444; }
        .form-static {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05);
            color: #ff4d4d; font-size: 14px; opacity: 0.8; display: flex; align-items: center; gap: 8px;
        }

        /* Table */
        .table-header {
            padding: 20px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.01);
        }
        .table-title { font-size: 18px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px;}
        .search-box { position: relative; }
        .search-box input {
            padding: 8px 16px 8px 36px; border-radius: 8px;
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-family: 'Outfit', sans-serif; font-size: 14px;
            outline: none; width: 240px; transition: all 0.2s;
        }
        .search-box input:focus { border-color: #ff1a1a; }
        .search-box input::placeholder { color: #444; }
        .search-box .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #555; }

        table { width: 100%; text-align: left; font-size: 14px; border-collapse: collapse; }
        thead tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { padding: 12px 16px; font-size: 11px; font-weight: 500; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 16px; }
        tbody tr { border-bottom: 1px solid rgba(255,255,255,0.03); transition: background 0.2s; }
        tbody tr:hover { background: rgba(255,255,255,0.015); }
        .mono { font-family: 'Courier New', monospace; color: #ccc; font-size: 13px; }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
        }
        .badge-online { background: rgba(59,130,246,0.1); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
        .badge-offline { background: rgba(107,114,128,0.1); color: #9ca3af; border: 1px solid rgba(107,114,128,0.2); }
        .badge-inactive { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .badge-available { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
        .badge-dot-online { background: #3b82f6; animation: pulse-badge 2s infinite; }
        .badge-dot-offline { background: #6b7280; }
        .badge-dot-inactive { background: #ef4444; }
        @keyframes pulse-badge { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .empty-state { padding: 40px 16px; text-align: center; color: #555; font-size: 14px; display:flex; flex-direction:column; align-items:center; gap:12px; }
        .loading-state { padding: 40px 16px; text-align: center; color: #555; font-size: 14px; animation: pulse-fade 1.5s infinite; }
        @keyframes pulse-fade { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #111; border: 1px solid rgba(255,26,26,0.2);
            border-radius: 20px; padding: 32px; width: 100%; max-width: 400px;
            text-align: center; transform: translateY(20px) scale(0.95); transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255,26,26,0.1);
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        .modal-icon {
            width: 64px; height: 64px; border-radius: 50%; background: rgba(255,26,26,0.1);
            color: #ff1a1a; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .modal-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; }
        .modal-desc { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .modal-btn-cancel { background: #222; color: #ccc; border: 1px solid #333; }
        .modal-btn-cancel:hover { background: #333; color: #fff; }

        /* Toast */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 10px;
            background: rgba(18,18,18,0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease-out;
        }
        .toast-success { border-left: 3px solid #10b981; }
        .toast-error { border-left: 3px solid #ef4444; }
        .toast-text { font-size: 14px; font-weight: 500; color: #fff; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .header {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                text-align: center;
                padding-bottom: 20px;
                margin-bottom: 24px;
            }
            .header-left {
                flex-direction: column;
                gap: 8px;
            }
            .table-header {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
                padding: 16px;
            }
            .search-box input {
                width: 100%;
            }
            .stat-value {
                font-size: 28px;
            }
            .auth-box {
                padding: 24px 16px;
            }
            .modal-box {
                padding: 20px 16px;
                margin: 0 16px;
            }
            .toast-container {
                right: 16px;
                left: 16px;
                bottom: 16px;
            }
            .toast {
                width: 100%;
                justify-content: center;
            }
            
            /* Responsive Table Enhancements */
            table { min-width: 550px; } /* Ensures table doesn't squish too much and allows horizontal scroll */
            th, td { padding: 12px 10px; font-size: 13px; }
            .btn-danger-sm { padding: 8px 12px; } /* Larger touch target for mobile */
            .badge { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="app">
        

            
            <!-- Toast Container for Login -->
            <div class="toast-container" style="bottom: 24px;">
                <div v-for="toast in toasts" :key="toast.id" :class="['toast', 'toast-' + toast.type]">
                    <i v-if="toast.type==='success'" data-lucide="check-circle" style="color:#10b981; width:20px;"></i>
                    <i v-else data-lucide="alert-circle" style="color:#ef4444; width:20px;"></i>
                    <span class="toast-text">{{ toast.message }}</span>
                </div>
            </div>
        </div>

        <!-- DASHBOARD (Only visible if logged >

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <img src="SaiKuto.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div>
                    <div class="header-title">GodDataX</div>
                    <div class="header-subtitle">Admin Server Dashboard</div>
                </div>
            </div>
            <div style="display:flex; gap:12px;">
    <button class="btn btn-glass" @click="fetchData">
        <i data-lucide="refresh-cw" style="width:16px; height:16px;"></i> Refresh
    </button>
</div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="glass stat-card">
                <div class="glow" style="background:rgba(255,26,26,0.15);"></div>
                <div class="stat-header">
                    <div>
                        <div class="stat-label">Total Lisensi</div>
                        <div class="stat-value">{{ stats.total }}</div>
                    </div>
                    <div class="stat-icon"><i data-lucide="key"></i></div>
                </div>
                <div class="stat-desc">Semua lisensi terdaftar di database</div>
            </div>
            <div class="glass stat-card">
                <div class="glow" style="background:rgba(16,185,129,0.1);"></div>
                <div class="stat-header">
                    <div>
                        <div class="stat-label">Perangkat Terdaftar</div>
                        <div class="stat-value">{{ stats.installed }}</div>
                    </div>
                    <div class="stat-icon"><i data-lucide="smartphone"></i></div>
                </div>
                <div class="stat-desc">Lisensi yang sudah terkunci ke 1 HWID HP</div>
            </div>
            <div class="glass stat-card">
                <div class="glow" style="background:rgba(59,130,246,0.1);"></div>
                <div class="stat-header">
                    <div>
                        <div class="stat-label">User Online</div>
                        <div class="stat-value">
                            {{ stats.online }}
                            <span v-if="stats.online > 0" class="pulse-dot">
                                <span class="ping"></span>
                                <span class="dot"></span>
                            </span>
                        </div>
                    </div>
                    <div class="stat-icon"><i data-lucide="zap"></i></div>
                </div>
                <div class="stat-desc">User yang saat ini berada di dalam aplikasi</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-grid">

            <!-- Generate License Form -->
            <div>
                <div class="glass" style="padding: 24px; position: sticky; top: 24px;">
                    <h3 style="font-size:18px; font-weight:600; color:#fff; margin-bottom:20px; display:flex; align-items:center; gap:8px;">
                        <i data-lucide="plus-circle" style="width:20px; height:20px; color:#ff1a1a;"></i> Buat Lisensi Baru
                    </h3>

                    <form @submit.prevent="generateLicense">
                        <div class="form-group">
                            <label class="form-label">License Key</label>
                            <input v-model="newKey" type="text" class="form-input" placeholder="contoh: TRX-LYNK-12345678" required>
                        </div>
